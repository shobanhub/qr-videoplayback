name: Auto Repair and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Auto-Repair Project Files
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

          if [ -d "app/app/src" ]; then
            echo "Flattening nested app/app directory..."
            cp -r app/app/* app/
            rm -rf app/app
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "QR Video"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Compile Release APK
        run: |
          ./gradlew assembleDebug

      - name: Create Signed Release APK
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias qrkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=QR Video,O=Android,C=IN"

          # திட்டத்தின் அனைத்து ஃபோல்டரிலும் உருவாகியுள்ள APK-ஐ தேடி எடுக்கிறது
          RAW_APK=$(find . -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)
          echo "Found compiled APK at: $RAW_APK"

          zipalign -v -p 4 "$RAW_APK" aligned-release.apk

          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass pass:password123 \
            --key-pass pass:password123 \
            --out QRVideo-Release-Signed.apk \
            aligned-release.apk

          mkdir -p output_zip
          cp QRVideo-Release-Signed.apk output_zip/

      - name: Upload Signed APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QRVideo-Signed-App-ZIP
          path: output_zip/
