name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Extract and Rebuild Project
        run: |
          # 1. Unzip app.zip
          if [ -f "app.zip" ]; then
            unzip -o app.zip[cite: 12]
          else
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)[cite: 12]
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE"[cite: 12]
            fi
          fi

          # 2. Fix nested app/app path
          if [ -d "app/app/src" ]; then
            echo "Fixing nested directories..."
            cp -r app/app/* app/ || true[cite: 12]
            rm -rf app/app[cite: 12]
          fi

          # 3. Create gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 4. Settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "QRScanner"
          include ':app'
          EOF

          # 5. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 6. App level build.gradle with WebKit
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.qrscanner.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.qrscanner.app"
                  minSdk 24
                  targetSdk 34
