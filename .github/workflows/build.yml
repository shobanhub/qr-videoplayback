name: Auto Repair and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Auto-Repair Project Files
        run: |
          # 1. Unpack ZIP
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

          # 2. Fix nested app/app path
          if [ -d "app/app/src" ]; then
            echo "Flattening nested app/app directory..."
            cp -rn app/app/* app/ || true
            rm -rf app/app
          fi

          # 3. Create gradle.properties (Fixes checkDebugAarMetadata error)
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 4. Settings.gradle with JitPack & Google
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "QR Video"
          include ':app'
          EOF

          # 5. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 6. App level build.gradle with Kotlin duplicates exclusion
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.qrvideo.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.qrvideo.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

              // CameraX
              def camerax_version = "1.3.1"
              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-view:${camerax_version}"

              // ZXing Scanner
              implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
              implementation 'com.google.zxing:core:3.5.3'

              // Standard Kotlin stdlib
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          EOF

          # 7. Wrapper generation
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Compile Release APK
        run: |
          ./gradlew assembleDebug

      - name: Create Signed Release APK
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign

          RAW_APK=$(find . -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)
          echo "Found compiled APK at: $RAW_APK"

          if [ -z "$RAW_APK" ]; then
            echo "ERROR: APK file could not be found!"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias qrkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=QR Video,O=Android,C=IN"

          zipalign -v -p 4 "$RAW_APK" aligned-release.apk

          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass pass:password123 \
            --key-pass pass:password123 \
            --out QRVideo-Release-Signed.apk \
            aligned-release.apk

          mkdir -p output_zip
          cp QRVideo-Release-Signed.apk output_zip/

      - name: Upload Signed APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QRVideo-Signed-App-ZIP
          path: output_zip/
