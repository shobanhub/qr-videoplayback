name: Auto Repair and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Auto-Repair Project Files
        run: |
          # 1. Unpack ZIP
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

          # 2. Fix nested app/app path (flatten directory)
          if [ -d "app/app/src" ]; then
            echo "Flattening nested app/app directory..."
            cp -rn app/app/* app/ || true
            rm -rf app/app
          fi

          # 3. Settings.gradle with JitPack & Google
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "QR Video"
          include ':app'
          EOF

          # 4. Clean root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 5. Fix Duplicate Classes by excluding old Kotlin stdlib modules
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              }
          }
          EOF

          # 6. Wrapper generation
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Compile Release APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Create Signed Release APK
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign

          RAW_APK=$(find . -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)
          echo "Found compiled APK at: $RAW_APK"

          if [ -z "$RAW_APK" ]; then
            echo "ERROR: APK file could not be found!"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias qrkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=QR Video,O=Android,C=IN"

          zipalign -v -p 4 "$RAW_APK" aligned-release.apk

          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass pass:password123 \
            --key-pass pass:password123 \
            --out QRVideo-Release-Signed.apk \
            aligned-release.apk

          mkdir -p output_zip
          cp QRVideo-Release-Signed.apk output_zip/

      - name: Upload Signed APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QRVideo-Signed-App-ZIP
          path: output_zip/
