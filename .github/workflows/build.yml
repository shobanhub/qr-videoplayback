name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Extract and Rebuild Project
        run: |
          # 1. Unzip archive if available
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

          # 2. Fix nested app directory if present
          if [ -d "app/app/src" ]; then
            echo "Fixing nested directories..."
            cp -r app/app/* app/ || true
            rm -rf app/app
          fi

          # 3. Detect package name dynamically from Java files
          PACKAGE_NAME=$(find app/src/main/java -name "*.java" -exec grep -m 1 "^package " {} \; | head -n 1 | sed 's/package //; s/;//' | tr -d '\r')
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.qrscanner.app"
          fi
          echo "Detected package: $PACKAGE_NAME"

          # 4. Create gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 5. Settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "QRScanner"
          include ':app'
          EOF

          # 6. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 7. App build.gradle with full compatibility dependencies
          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34

              defaultConfig {
                  applicationId '$PACKAGE_NAME'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.webkit:webkit:1.11.0'

              // CameraX & Scanner support
              def camerax_version = "1.3.1"
              implementation "androidx.camera:camera-core:\${camerax_version}"
              implementation "androidx.camera:camera-camera2:\${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:\${camerax_version}"
              implementation "androidx.camera:camera-view:\${camerax_version}"
              implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
              implementation 'com.google.zxing:core:3.5.3'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          EOF

          # 8. Wrapper generation
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-App
          path: app/build/outputs/apk/debug/*.apk
