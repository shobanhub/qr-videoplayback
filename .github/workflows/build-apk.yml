name: Auto Repair and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Auto-Repair Project Files
        run: |
          # 1. Unpack ZIP
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

          # 2. Fix nested app/app path
          if [ -d "app/app/src" ]; then
            echo "Flattening nested app/app directory..."
            cp -r app/app/* app/
            rm -rf app/app
          fi

          # 3. Settings.gradle with plugin repositories
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "QR Video"
          include ':app'
          EOF

          # 4. Root build.gradle with plugin version definition
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 5. App level build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.qrvideo.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.qrvideo.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.camera:camera-core:1.3.1'
              implementation 'androidx.camera:camera-camera2:1.3.1'
              implementation 'androidx.camera:camera-lifecycle:1.3.1'
              implementation 'androidx.camera:camera-view:1.3.1'
              implementation 'com.google.zxing:core:3.5.3'
              implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
          }
          EOF

          # 6. Generate wrapper using Gradle 8.4
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Compile Release APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Create Signed Release APK
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias qrkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=QR Video,O=Android,C=IN"

          RAW_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)

          zipalign -v -p 4 "$RAW_APK" aligned-release.apk

          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass pass:password123 \
            --key-pass pass:password123 \
            --out QRVideo-Release-Signed.apk \
            aligned-release.apk

          mkdir -p output_zip
          cp QRVideo-Release-Signed.apk output_zip/

      - name: Upload Signed APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QRVideo-Signed-App-ZIP
          path: output_zip/
