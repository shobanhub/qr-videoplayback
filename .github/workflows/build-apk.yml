name: Build Android Project to APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project Files
        run: |
          # ZIP file-ai thedi extract seigirathu
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

          # Gradle wrapper-kku execution permission tharukirathu
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper illai, system gradle kondu build seigirathu..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Video-App-Debug
          path: "**/build/outputs/apk/**/*.apk"
