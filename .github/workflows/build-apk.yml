name: Convert ZIP to APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign

      - name: Find and Extract ZIP
        run: |
          # Finds any .zip file present in the repo automatically
          ZIP_NAME=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_NAME" ]; then
            echo "ERROR: Repo-ல எந்த ஒரு .zip file-உம் கிடைக்கவில்லை!"
            exit 1
          fi
          echo "Processing file: $ZIP_NAME"
          mkdir extracted
          unzip "$ZIP_NAME" -d extracted/
          cd extracted
          zip -r ../unsigned.apk .
          cd ..

      - name: Align APK
        run: |
          zipalign -v -p 4 unsigned.apk aligned.apk

      - name: Generate Key and Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out release.apk \
            aligned.apk

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: release.apk
