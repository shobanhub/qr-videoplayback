name: Build Android Project to APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project Files & Flatten Directory
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

          # Files app/ folder-kulle irundhaal root-kku kondu varugiradhu
          if [ -d "app" ] && [ -f "app/settings.gradle" ]; then
            echo "Moving project files from nested app folder to root..."
            cp -r app/* .
          fi

          # Gradle wrapper generate seigirom
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Video-App-Debug
          path: "**/build/outputs/apk/**/*.apk"
